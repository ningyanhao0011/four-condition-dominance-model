# Scenario grid for A4 closure and replication
# These are the highest-instability variables in the model.
# They are treated as scenario parameters, NOT point estimates.
#
# Each scenario defines a plausible interpretation of where A4 stands
# on organizational closure and replication.
#
# All values are dimensionless [0, 1], normalized.

scenarios:

  strict_current_ai:
    label: "Strict current AI"
    description: >
      AI systems have minimal operational autonomy. Hardware fully
      human-maintained. Replication is copying/deployment, not
      organizational propagation. Most conservative reading.
    A4_closure: 0.10
    A4_replication: 0.08
    plausibility: high
    notes: "Defensible floor for current systems"

  semi_autonomous_infra:
    label: "Semi-autonomous infrastructure AI"
    description: >
      AI systems have partial software-level self-monitoring and
      automated retraining pipelines. Hardware still human-maintained.
      Replication is organizational propagation through design lineage
      but human-initiated.
    A4_closure: 0.20
    A4_replication: 0.20
    plausibility: medium-high
    notes: "Plausible near-term (2025-2030) reading"

  propagating_ai:
    label: "Organizationally propagating AI"
    description: >
      AI systems participate meaningfully in their own maintenance
      (AI-assisted code generation, automated infrastructure scaling,
      architecture search). Replication includes AI-assisted design
      of successor models. Human oversight remains but is less
      granular.
    A4_closure: 0.40
    A4_replication: 0.35
    plausibility: medium
    notes: "Plausible medium-term (2030-2040); requires significant autonomy gains"

  technogenesis:
    label: "Strong technogenesis"
    description: >
      AI systems approach organizational self-maintenance across
      most of the lifecycle. Replication includes autonomous or
      semi-autonomous creation of successor systems with recognizable
      lineage and variation. Approaches A5 boundary territory.
    A4_closure: 0.65
    A4_replication: 0.55
    plausibility: speculative
    notes: "Not currently observed; included for crossover analysis"

  full_autonomy:
    label: "Full autonomy (A5-like)"
    description: >
      Hypothetical fully self-maintaining, self-reproducing AI
      infrastructure. Included only for sensitivity analysis
      upper bound. Not a prediction.
    A4_closure: 0.90
    A4_replication: 0.80
    plausibility: highly speculative
    notes: "A5 boundary; no empirical basis; clearly label in all outputs"

# H3 values are held constant across scenarios (from base_case.yaml):
#   H3_closure_mid: 0.90
#   H3_replication_mid: 0.70

# H1 and A3 values for robustness pair are held constant:
#   H1_closure: 1.0 (autopoietic)
#   H1_replication_mid: 0.38 (TFR normalized)
#   A3_closure_mid: 0.23 (facility autonomous duration normalized)
#   A3_replication: null (not replication per stabilized def)

# The scenario grid is crossed with dissipation low/mid/high from base_case.yaml.
# Total scenario runs = 5 scenarios × 3 energy levels = 15 for primary pair.
