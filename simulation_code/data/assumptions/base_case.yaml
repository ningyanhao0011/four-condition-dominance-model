# Base case assumptions for the dominance model — operationalization v2
# Two-layer architecture: Layer A (energy backbone) + Layer B (threshold gate)
# h(Z) = 1 in base case. Resilience deferred.
# Closure and replication are scenario variables for A4, not point estimates.

model:
  # Layer B: threshold gate
  threshold_type: sigmoid          # Options: sigmoid (default), binary (robustness)
  k_C: 10                         # closure steepness; sweep [2, 50]
  k_R: 10                         # replication steepness; sweep [2, 50]
  C_star: 0.5                     # closure midpoint threshold
  R_star: 0.5                     # replication midpoint threshold

  # Layer A: energy backbone + resilience
  functional_form: multiplicative  # Options: multiplicative, additive_weighted, multiplicative_log_dissipation
  resilience_mode: disabled        # h(Z) = 1 in base case; set to "enabled" later
  temporal_mode: snapshot          # Options: snapshot, rolling_average, trajectory_integrated

  # Comparison modes
  # D_energy = E                   (energy-only, no gate)
  # D_gated  = Gate(C,R) × E      (threshold-gated, h(Z)=1)

systems:
  primary:
    human: H3        # human civilization
    ai: A4           # AI-linked technospheric subsystem
  robustness:
    human: H1        # individual human organism
    ai: A3           # data center + software stack

# ---- DISSIPATION (Layer A — ready for calibration) ----
dissipation:
  H3:
    name: total_primary_energy_functional
    unit: TW
    type: observed/inferred
    total_primary_energy_TW: 18.4     # ~580 EJ/yr, IEA
    functional_fraction:
      low: 0.30
      mid: 0.41
      high: 0.55
    value:
      low: 5.7      # 18.4 × 0.30
      mid: 7.6      # 18.4 × 0.41
      high: 10.0    # 18.4 × 0.55
  A4:
    name: ai_compute_energy_pue_adjusted
    unit: TW
    type: observed/inferred
    value:
      low: 0.03
      mid: 0.06
      high: 0.15
    note: "boundary between AI and general IT is blurry; re-check annually"
  H1:
    name: basal_metabolic_rate
    unit: W
    type: observed
    value:
      low: 70
      mid: 80
      high: 90
  A3:
    name: facility_energy_pue_adjusted
    unit: MW
    type: observed
    value:
      low: 30
      mid: 60
      high: 150

# ---- CLOSURE (Layer B — H3 estimated; A4 is scenario variable) ----
closure:
  H3:
    name: institutional_self_maintenance_ratio
    unit: "dimensionless [0,1]"
    type: inferred
    value:
      low: 0.85
      mid: 0.90
      high: 0.95
    note: "near-trivially high; gate ≈ 1 for H3"
  A4:
    name: autonomous_ops_fraction
    unit: "dimensionless [0,1]"
    type: inferred
    value: null  # SET VIA SCENARIO GRID — do not point-estimate
    instability: critical
    note: "highest-instability variable; see scenario_grid.yaml"
  H1:
    name: autopoietic_completeness
    type: observed
    value: 1.0
    note: "calibration anchor"
  A3:
    name: facility_autonomous_duration_normalized
    unit: "dimensionless [0,1]"
    type: observed/inferred
    value:
      low: 0.03     # 24h / 720h max
      mid: 0.23     # 168h / 720h max
      high: 1.0     # 720h / 720h max

# ---- REPLICATION (Layer B — H3 estimated; A4 is scenario variable) ----
replication:
  H3:
    name: civilizational_propagation_rate_normalized
    unit: "dimensionless [0,1]"
    type: inferred
    value:
      low: 0.5
      mid: 0.7
      high: 0.9
    note: "normalization TBD; human civ clearly above threshold"
  A4:
    name: model_generation_succession_normalized
    unit: "dimensionless [0,1]"
    type: observed
    value: null  # SET VIA SCENARIO GRID — do not point-estimate
    instability: critical
    note: "human-driven process; second-highest instability variable"
    caveat: "infrastructure-mediated organizational propagation, not autonomous replication"
  H1:
    name: total_fertility_rate_normalized
    unit: "dimensionless [0,1]"
    type: observed
    value:
      low: 0.17     # TFR 1.0 / 6.0
      mid: 0.38     # TFR 2.3 / 6.0
      high: 1.0     # TFR 6.0 / 6.0
  A3:
    name: instance_scaling_rate
    type: observed
    value: null
    note: "not replication per stabilized definition; calibration only"

# ---- RESILIENCE (deferred — h(Z) = 1) ----
resilience:
  note: "all systems set to Z=1 in base case; resilience enters in future pass"

warnings:
  nested_system: >
    A4 is currently a subsystem of H3. The primary comparison does not
    represent competition between independent systems. Results should be
    interpreted as relative organizational trajectory within a coupled system.
    See nested_systems_note.md.
  weak_ai_replication: >
    Current AI replication proxies measure human-driven organizational
    propagation, not autonomous self-replication. A4 replication scores
    are expected to be low. This is the framework's honest assessment.
  resilience_deferred: >
    h(Z) = 1 in base case. Resilience proxies are the least operationalized.
    Adding resilience should not change qualitative base-case results.
  a4_gate_dominance: >
    A4 closure and replication are the highest-instability quantities.
    They gate the entire A4 score. Treated as scenario variables, not
    point estimates. See scenario_grid.yaml.
